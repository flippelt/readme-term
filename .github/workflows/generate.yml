name: Generate terminal SVG

on:
  schedule:
    # 00:00 UTC daily. Change this in the copy of the template — see README "Cron".
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Optional write deploy key: this origin's ruleset-protected main
      # rejects GITHUB_TOKEN pushes. Template copies leave the secret unset.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - name: Render assets/boot.svg
        run: python3 generate.py --examples
      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "boot.svg unchanged"
            exit 0
          fi
          git commit -m "chore: refresh boot.svg [skip ci]"
          git push
